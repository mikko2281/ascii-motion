server {
    listen 80;
    server_name _;
    client_max_body_size 210M;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_request_buffering off;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
